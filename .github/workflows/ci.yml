name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (core tests + app build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app
        run: swift build --product MulticaApp
      - name: Bundle app
        run: scripts/bundle-app.sh
      - name: Benchmarks
        run: swift run -c release multica-bench | tee -a "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux (core tests)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
